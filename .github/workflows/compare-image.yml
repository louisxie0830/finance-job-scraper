# Temporary: compares the production (master) Dockerfile with this branch's image size.
name: Compare image size

on:
  push:
    branches: ['feat/**']

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - name: Build both
        run: |
          git show origin/master:Dockerfile > Dockerfile.master
          docker buildx build --load -t img:master -f Dockerfile.master .
          docker buildx build --load -t img:branch .
      - name: Sizes
        run: |
          docker image ls img --format '{{.Tag}}\t{{.Size}}'
          for t in master branch; do
            echo "== $t"
            docker history img:$t --format '{{.Size}}\t{{.CreatedBy}}' | cut -c1-140 | head -12
          done
