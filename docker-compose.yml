services:
  web:
    build: .
    ports:
      # Bound to the host's loopback only; put a reverse proxy (TLS) in front for remote access.
      - '127.0.0.1:3000:3000'
    environment:
      NODE_ENV: production
      # Requests from the host reach the container from the Docker network, not 127.0.0.1.
      ALLOWED_IPS: '*'
      # Optional: require an X-API-Key header (comma-separated keys), e.g. from a .env file.
      API_KEYS: ${API_KEYS:-}
      # CORS_ORIGINS: 'https://your-frontend.example'
    # Chrome needs more shared memory than Docker's 64MB default.
    shm_size: '1gb'
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /home/node
    volumes:
      - logs:/workspace/logs
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g

volumes:
  logs:
